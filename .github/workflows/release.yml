#
# RAT Flea DevSec — release pipeline. Triggered by pushing a version tag:
#   python scripts/release/version.py bump 1.3.0   →  update CHANGELOG.md  →  commit
#   git tag -s v1.3.0 -m "RAT Flea DevSec 1.3.0" && git push origin v1.3.0
# Produces: signed platform + CLI images, signed Helm chart (OCI), SBOM, customer release notes,
# checksums and a GitHub Release. Tags containing "-" (v1.3.0-rc.1) are published as pre-releases.
name: release
on:
  push: { tags: ["v[0-9]+.[0-9]+.[0-9]+*"] }
permissions: { contents: read }
concurrency: { group: "release-${{ github.ref }}", cancel-in-progress: false }

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Tag, product files and CHANGELOG agree on the version
        run: python3 scripts/release/version.py check "${GITHUB_REF_NAME}"
      - name: Tag is on main
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "release tags must point to a commit on main"; exit 1; }

  ci:
    needs: gate
    uses: ./.github/workflows/ci.yml
    permissions: { contents: read, pull-requests: read, packages: write, id-token: write, attestations: write }
    secrets: inherit

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: release            # add required reviewers to this environment for a manual approval step
    permissions: { contents: write, packages: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Release variables
        id: v
        run: |
          mkdir -p dist             # release assets: SBOM, chart, notes, checksums
          V="${GITHUB_REF_NAME#v}"; OWNER="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          { echo "version=$V"; echo "minor=$(echo "$V" | cut -d. -f1,2)"; echo "owner=$OWNER"
            echo "image=ghcr.io/$OWNER/nerve-myelin"; echo "cli=ghcr.io/$OWNER/myelin-cli"
            echo "charts=oci://ghcr.io/$OWNER/charts"
            case "$V" in *-*) echo "pre=true";; *) echo "pre=false";; esac; } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push platform image
        id: img
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.minor }}
      - name: Build and push CLI image
        id: cli
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          file: Dockerfile.cli
          push: true
          provenance: mode=max
          tags: |
            ${{ steps.v.outputs.cli }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.cli }}:${{ steps.v.outputs.minor }}
      - name: Vulnerability gate on the released image (fixable critical/high fail the release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0  # v0.28.0
        with:
          image-ref: ${{ steps.v.outputs.image }}@${{ steps.img.outputs.digest }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          image-ref: ${{ steps.v.outputs.image }}@${{ steps.img.outputs.digest }}
          format: cyclonedx
          output: dist/nerve-myelin-${{ steps.v.outputs.version }}.sbom.cdx.json
          scan-type: image
          exit-code: "0"
          skip-setup-trivy: true
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac  # v3
      - name: Sign images and attest SBOM (keyless, bound to this workflow and tag)
        run: |
          cosign sign --yes "${{ steps.v.outputs.image }}@${{ steps.img.outputs.digest }}"
          cosign sign --yes "${{ steps.v.outputs.cli }}@${{ steps.cli.outputs.digest }}"
          cosign attest --yes --type cyclonedx --predicate dist/nerve-myelin-${{ steps.v.outputs.version }}.sbom.cdx.json \
            "${{ steps.v.outputs.image }}@${{ steps.img.outputs.digest }}"
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4  # v4
      - name: Package chart pinned to the signed image digest, push and sign
        run: |
          V=${{ steps.v.outputs.version }}
          sed -i "s|^  repository: .*|  repository: ${{ steps.v.outputs.image }}|; s|^  digest: \"\".*|  digest: \"${{ steps.img.outputs.digest }}\"|" deploy/helm/myelin/values.yaml
          helm lint deploy/helm/myelin
          helm package deploy/helm/myelin --version "$V" --app-version "$V" -d dist
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin
          helm push "dist/myelin-$V.tgz" "${{ steps.v.outputs.charts }}" 2>&1 | tee push.log
          DIGEST=$(grep -o 'sha256:[0-9a-f]\{64\}' push.log | head -1)
          cosign sign --yes "ghcr.io/${{ steps.v.outputs.owner }}/charts/myelin@$DIGEST"
      - name: Release notes and checksums
        run: |
          python3 scripts/release/notes.py "${{ steps.v.outputs.version }}" \
            --image "${{ steps.v.outputs.image }}" --chart "${{ steps.v.outputs.charts }}/myelin" \
            --digest "${{ steps.img.outputs.digest }}" > dist/RELEASE-NOTES-${{ steps.v.outputs.version }}.md
          cp CHANGELOG.md dist/
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Publish GitHub Release
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          PRE=""; [ "${{ steps.v.outputs.pre }}" = "true" ] && PRE="--prerelease"
          gh release create "$GITHUB_REF_NAME" dist/* $PRE --verify-tag \
            --title "RAT Flea DevSec ${{ steps.v.outputs.version }}" \
            --notes-file "dist/RELEASE-NOTES-${{ steps.v.outputs.version }}.md"
